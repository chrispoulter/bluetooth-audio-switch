name: CI

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Restore
        run: dotnet restore BluetoothAudioSwitch.slnx

      - name: Build
        run: dotnet build BluetoothAudioSwitch.slnx -c Release --no-restore

      - name: Test
        run: dotnet test BluetoothAudioSwitch.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

  publish:
    name: Publish ${{ matrix.rid }}
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { "1.0.0-ci.${{ github.run_number }}" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish src/BluetoothAudioSwitch/BluetoothAudioSwitch.csproj
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}

      - name: Package
        shell: pwsh
        env:
          PUBLISH_DIR: src/BluetoothAudioSwitch/bin/Release/net10.0-windows10.0.19041.0/${{ matrix.rid }}/publish
        run: |
          Compress-Archive -Path "$env:PUBLISH_DIR/*", README.md, LICENSE -DestinationPath btaudio-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: btaudio-${{ matrix.rid }}
          path: btaudio-*.zip

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: btaudio-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" btaudio-*.zip --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
